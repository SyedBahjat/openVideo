name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [Desktop app, Website, Share links / GitHub storage]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and version
      placeholder: macOS 15.2 (Apple silicon) / Windows 11 / Chrome 131
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what you saw instead. Include any error message shown in the app.
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots or logs. Never paste GitHub tokens or client secrets.
