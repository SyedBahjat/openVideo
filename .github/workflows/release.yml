name: Release desktop app

# Push a tag like v0.2.0 to build installers and attach them to one GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Create the release once, up front. If the macOS and Windows jobs each created it,
  # they would race and leave two releases for the same tag.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "openVideo ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build and upload installers
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned builds until a code-signing certificate is added (see README → Install).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
