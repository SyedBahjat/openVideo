name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # unit tests don't launch Electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Syntax check
        run: for f in main.js preload.js share.js lib.js teleprompter.js renderer/*.js; do node --check "$f"; done

  speech-helper:
    name: Teleprompter speech helper (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh native/build-mac.sh
      - run: lipo -archs native/bin/openvideo-speech

  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx eslint .
      - name: Type check
        run: npx next typegen && npx tsc --noEmit
      - run: npm run build
