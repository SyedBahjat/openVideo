<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>openVideo recording bar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="overlay">
  <div class="bar" role="toolbar" aria-label="openVideo recording bar">
    <span class="bar-grip" aria-hidden="true" title="Drag to move"><i></i><i></i><i></i><i></i><i></i><i></i></span>

    <button id="source" class="bar-source" title="Choose what to record">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      <span id="source-name">Display</span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
    </button>

    <span class="bar-sep" aria-hidden="true"></span>

    <button id="camera" class="bar-toggle" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="m16 11 5-3v8l-5-3"/><path class="off" d="M3 3l18 18"/></svg>
      <span class="bar-label">Camera</span>
    </button>
    <button id="mic" class="bar-toggle" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="off" d="M3 3l18 18"/></svg>
      <span class="bar-label">Mic</span>
    </button>
    <button id="sys" class="bar-toggle" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/><path class="off" d="M3 3l18 18"/></svg>
      <span class="bar-label">Audio</span>
    </button>
    <button id="tp" class="bar-toggle" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h10M7 17h6"/></svg>
      <span class="bar-label">Prompter</span>
    </button>

    <span class="bar-sep" aria-hidden="true"></span>

    <button id="record" class="bar-rec"><span class="dot" aria-hidden="true"></span><span id="record-label">Record</span></button>
    <button id="panel" class="bar-icon" title="Open openVideo (settings, script, library)" aria-label="Open openVideo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
    </button>
    <button id="hide" class="bar-icon" title="Hide the bar (show it again from the app)" aria-label="Hide the bar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <script src="launcher.js"></script>
</body>
</html>
