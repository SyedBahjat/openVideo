<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
  <title>openVideo controls</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="overlay">
  <div class="pill" role="toolbar" aria-label="Recording controls">
    <button id="stop" class="stop" title="Stop and save" aria-label="Stop and save"><span></span></button>
    <output id="time" class="time" aria-live="off">0:00</output>
    <button id="draw" title="Draw (⌘⇧D / Ctrl+Shift+D)" aria-label="Draw" aria-pressed="false">✎</button>
    <button id="pause" title="Pause" aria-label="Pause">❚❚</button>
    <button id="restart" title="Restart (discards this take)" aria-label="Restart">↺</button>
    <button id="cancel" title="Cancel (discards this take)" aria-label="Cancel">✕</button>
  </div>
  <script src="controls.js"></script>
</body>
</html>
